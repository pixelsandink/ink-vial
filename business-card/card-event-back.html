<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ink Vial Event Card (back)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Single-sided event card. 85x55mm trim + 3mm bleed = 91x61mm. */
@page{size:91mm 61mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
.card{width:91mm;height:61mm;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;background:#faf3e8;color:#3d2458}
.dot{position:absolute;border-radius:50%}
.d1{width:46mm;height:46mm;background:#ede6f8;left:-15mm;top:-20mm}
.d2{width:30mm;height:30mm;background:#d4c4ee;right:-10mm;bottom:-14mm}
.d3{width:4mm;height:4mm;background:#f5a0b0;right:20mm;top:11mm}
.c{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
h1{font-family:'Playfair Display',serif;font-size:10mm;line-height:1;color:#3d2458}
.tag{font-family:'Playfair Display',serif;font-style:italic;font-size:3.6mm;color:#5c3a9a;margin-top:2.4mm}
.rule{width:10mm;height:.6mm;background:#f5a0b0;margin:4.5mm auto;border-radius:1mm}
.row{font-weight:800;font-size:3.1mm;line-height:1.7;color:#3d2458}
@media screen{.card{margin:8mm auto;box-shadow:0 2mm 6mm rgba(0,0,0,.4)}}
</style></head><body>
<section class="card">
  <i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i>
  <div class="c">
    <h1>Ink Vial</h1>
    <p class="tag">Curated ink samples for ink lovers.</p>
    <div class="rule"></div>
    <p class="row">www.inkvial.co.uk</p>
    <p class="row">hello@inkvial.co.uk</p>
  </div>
</section>
</body></html>
