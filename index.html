<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ink Vial — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #faf3e8;
      --purple-deep:    #3d2458;
      --purple-dark:    #5c3a9a;
      --purple-mid:     #8b68cc;
      --lavender:       #b09ad8;
      --lavender-light: #d4c4ee;
      --lavender-pale:  #ede6f8;
      --pink:           #f5a0b0;
      --surface:        #ffffff;
      --muted:          rgba(61,36,88,0.48);
      --radius:         16px;
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      color: var(--purple-deep);
      overflow-x: hidden;
    }

    /* ── Ambient background blobs ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 10% 15%, rgba(176,154,216,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 88% 82%, rgba(245,160,176,0.20) 0%, transparent 55%),
        radial-gradient(ellipse 35% 40% at 72% 18%, rgba(200,180,240,0.18) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .blobs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      opacity: 0.20;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .blob-1 { width: 500px; height: 500px; background: #c4b0e4; top: -12%; left: -8%;  animation-duration: 25s; }
    .blob-2 { width: 340px; height: 340px; background: #f5a0b0; bottom: -10%; right: -8%; animation-duration: 19s; animation-delay: -8s; }
    .blob-3 { width: 240px; height: 240px; background: #a48dd4; top: 52%; left: 58%; animation-duration: 15s; animation-delay: -4s; }

    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(28px,-20px) scale(1.04); }
      100% { transform: translate(-18px,24px) scale(0.97); }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    /* ── Kawaii bottle icon ── */
    .bottle-icon {
      width: 96px;
      height: auto;
      margin-bottom: 20px;
      animation: float 5s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(140,100,210,0.22));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%       { transform: translateY(-10px) rotate(1deg); }
    }

    /* ── Brand name ── */
    .brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 700;
      color: var(--purple-dark);
      letter-spacing: 0.03em;
      line-height: 1;
      margin-bottom: 10px;
    }

    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      color: var(--purple-mid);
      letter-spacing: 0.10em;
      margin-bottom: 52px;
    }

    /* ── Countdown ── */
    .countdown-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .countdown {
      display: flex;
      gap: clamp(10px, 3vw, 20px);
      margin-bottom: 18px;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .unit-box {
      width: clamp(72px, 16vw, 106px);
      height: clamp(72px, 16vw, 106px);
      background: var(--surface);
      border: 2px solid var(--lavender-light);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 24px rgba(140,100,210,0.10),
        0 1px 0 rgba(255,255,255,0.9) inset;
    }

    .unit-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      color: var(--purple-dark);
      line-height: 1;
    }

    .unit-name {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @keyframes tick-pulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.10); color: var(--purple-mid); }
      100% { transform: scale(1); }
    }
    .tick { animation: tick-pulse 0.35s ease-out; }

    .launch-date {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 48px;
      text-transform: uppercase;
    }

    /* ── Separator ── */
    .sep {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--lavender), transparent);
      margin: 0 auto 40px;
      border-radius: 2px;
    }

    /* ── Launched state ── */
    .launched-msg {
      display: none;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: var(--purple-dark);
      margin-bottom: 20px;
    }

    /* ── Social links ── */
    .socials {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .socials a {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .socials a:hover { color: var(--purple-dark); }
    .socials a svg   { width: 16px; height: 16px; fill: currentColor; }

    footer {
      position: relative;
      z-index: 1;
      padding: 20px 24px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<div class="blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main class="page">

    <defs>

        <rect x="18" y="8" width="84" height="44" rx="13"/>

    <!-- Cap -->
    <rect x="18" y="8" width="84" height="44" rx="13" fill="#c4b0e4" stroke="#4a2d7a" stroke-width="3.5"/>
    <rect x="18" y="8" width="84" height="16" rx="13" fill="#d8ccf2"/>
    <!-- Cap ridges -->
    <g clip-path="url(#capClip)" opacity="0.18">
      <line x1="34"  y1="8" x2="34"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="47"  y1="8" x2="47"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="60"  y1="8" x2="60"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="73"  y1="8" x2="73"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="86"  y1="8" x2="86"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
    </g>

    <!-- Neck -->
    <rect x="34" y="50" width="52" height="18" rx="4" fill="#f0eaf8" stroke="#4a2d7a" stroke-width="3"/>

    <!-- Bottle body -->
    <path d="M12,66 H108 V130 Q108,158 60,158 Q12,158 12,130 V66 Z"
          fill="#f0eaf8" stroke="#4a2d7a" stroke-width="3.5"/>

    <!-- Ink fill -->
    <path d="M13.8,94 H106.2 V130 Q106.2,156.2 60,156.2 Q13.8,156.2 13.8,130 V94 Z"
          fill="#a48dd4" opacity="0.72"/>

    <!-- Ink surface shimmer -->
    <ellipse cx="60" cy="94" rx="46" ry="4.5" fill="rgba(255,255,255,0.28)"/>

    <!-- Glass shine -->
    <rect x="94" y="68" width="8" height="52" rx="4" fill="rgba(255,255,255,0.20)"/>

    <!-- Eyes -->
    <circle cx="44" cy="108" r="5.5" fill="#3d2458"/>
    <circle cx="46" cy="106" r="2"   fill="white"/>
    <circle cx="76" cy="108" r="5.5" fill="#3d2458"/>
    <circle cx="78" cy="106" r="2"   fill="white"/>

    <!-- Blush -->
    <ellipse cx="33"  cy="116" rx="9" ry="6" fill="#f5a0b0" opacity="0.68"/>
    <ellipse cx="87"  cy="116" rx="9" ry="6" fill="#f5a0b0" opacity="0.68"/>

    <!-- Smile -->
    <path d="M44,120 Q60,135 76,120"
          stroke="#3d2458" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Ink bubble -->
    <circle cx="27" cy="132" r="4" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  </svg>

  <h1 class="brand">Ink Vial</h1>
  <p class="tagline">Something beautiful is brewing</p>

  <p class="countdown-label">Launching in</p>

  <div class="countdown" role="timer" aria-live="polite" aria-label="Countdown to launch">
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="days">00</span></div>
      <span class="unit-name">Days</span>
    </div>
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="hours">00</span></div>
      <span class="unit-name">Hours</span>
    </div>
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="minutes">00</span></div>
      <span class="unit-name">Minutes</span>
    </div>
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="seconds">00</span></div>
      <span class="unit-name">Seconds</span>
    </div>
  </div>

  <p class="launch-date">5 June 2026 &middot; 6:00 PM BST</p>
  <p class="launched-msg" id="launched-msg">We're live — welcome to Ink Vial!</p>

  <div class="sep"></div>

  <nav class="socials" aria-label="Social media">
    <a href="#" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      Instagram
    </a>
    <span style="color:var(--lavender-light)">·</span>
    <a href="#" aria-label="TikTok">
      <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
      TikTok
    </a>
  </nav>

</main>

<footer>&copy; 2026 Ink Vial &nbsp;&middot;&nbsp; United Kingdom</footer>

<script>
  const LAUNCH = new Date('2026-06-05T17:00:00Z').getTime();
  const els = {
    days:    document.getElementById('days'),
    hours:   document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
  };
  function pad(n) { return String(n).padStart(2, '0'); }
  function pulse(el, val) {
    if (el.textContent !== val) {
      el.textContent = val;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }
  }
  function tick() {
    const diff = LAUNCH - Date.now();
    if (diff <= 0) {
      Object.keys(els).forEach(k => els[k].textContent = '00');
      document.getElementById('launched-msg').style.display = 'block';
      return;
    }
    pulse(els.days,    pad(Math.floor(diff / 86400000)));
    pulse(els.hours,   pad(Math.floor((diff % 86400000) / 3600000)));
    pulse(els.minutes, pad(Math.floor((diff % 3600000) / 60000)));
    pulse(els.seconds, pad(Math.floor((diff % 60000) / 1000)));
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
