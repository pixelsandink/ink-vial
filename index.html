<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ink Vial — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #faf3e8;
      --purple-deep:    #3d2458;
      --purple-dark:    #5c3a9a;
      --purple-mid:     #8b68cc;
      --lavender:       #b09ad8;
      --lavender-light: #d4c4ee;
      --lavender-pale:  #ede6f8;
      --pink:           #f5a0b0;
      --surface:        #ffffff;
      --muted:          rgba(61,36,88,0.48);
      --radius:         16px;
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      color: var(--purple-deep);
      overflow-x: hidden;
    }

    /* ── Ambient background blobs ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 10% 15%, rgba(176,154,216,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 88% 82%, rgba(245,160,176,0.20) 0%, transparent 55%),
        radial-gradient(ellipse 35% 40% at 72% 18%, rgba(200,180,240,0.18) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .blobs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      opacity: 0.20;
      animation: drift 20s ease-in-out infinite alternate;
    }
    .blob-1 { width: 500px; height: 500px; background: #c4b0e4; top: -12%; left: -8%;  animation-duration: 25s; }
    .blob-2 { width: 340px; height: 340px; background: #f5a0b0; bottom: -10%; right: -8%; animation-duration: 19s; animation-delay: -8s; }
    .blob-3 { width: 240px; height: 240px; background: #a48dd4; top: 52%; left: 58%; animation-duration: 15s; animation-delay: -4s; }

    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(28px,-20px) scale(1.04); }
      100% { transform: translate(-18px,24px) scale(0.97); }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      text-align: center;
    }

    /* ── Logo ── */
    .bottle-icon {
      width: 300px;
      height: auto;
      margin-bottom: 16px;
      animation: float 5s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(140,100,210,0.20));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%       { transform: translateY(-10px) rotate(1deg); }
    }

    /* ── Brand name ── */
    .brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 700;
      color: var(--purple-dark);
      letter-spacing: 0.03em;
      line-height: 1;
      margin-bottom: 10px;
    }

    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      color: var(--purple-mid);
      letter-spacing: 0.10em;
      margin-bottom: 52px;
    }

    /* ── Countdown ── */
    .countdown-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .countdown {
      display: flex;
      gap: clamp(10px, 3vw, 20px);
      margin-bottom: 18px;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .unit-box {
      width: clamp(72px, 16vw, 106px);
      height: clamp(72px, 16vw, 106px);
      background: var(--surface);
      border: 2px solid var(--lavender-light);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 24px rgba(140,100,210,0.10),
        0 1px 0 rgba(255,255,255,0.9) inset;
    }

    .unit-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      color: var(--purple-dark);
      line-height: 1;
    }

    .unit-name {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @keyframes tick-pulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.10); color: var(--purple-mid); }
      100% { transform: scale(1); }
    }
    .tick { animation: tick-pulse 0.35s ease-out; }

    .launch-date {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 4.5vw, 2.2rem);
      font-weight: 700;
      color: var(--purple-dark);
      margin-bottom: 8px;
    }

    .blurb {
      font-size: clamp(0.88rem, 2vw, 1rem);
      color: var(--muted);
      line-height: 2;
      max-width: 560px;
      margin: 0 auto 36px;
      white-space: nowrap;
    }

    /* ── Separator ── */
    .sep {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--lavender), transparent);
      margin: 0 auto 40px;
      border-radius: 2px;
    }

    /* ── Launched state ── */
    .launched-msg {
      display: none;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: var(--purple-dark);
      margin-bottom: 20px;
    }

    /* ── Social links ── */
    .socials {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .socials a {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .socials a:hover { color: var(--purple-dark); }
    .socials a svg   { width: 16px; height: 16px; fill: currentColor; }

    footer {
      position: relative;
      z-index: 1;
      padding: 20px 24px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .nav-brand{font-family:'Playfair Display',Georgia,serif;font-size:1.35rem;font-weight:700;color:var(--purple-dark);letter-spacing:0.01em;white-space:nowrap;}
  @media(max-width:480px){.nav-brand{font-size:1.1rem;}}
</style>
</head>
<body>

<div class="blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main class="page">

  <img class="bottle-icon" src="inkvial-logo-nobg.png" alt="Ink Vial" />
  <!-- legacy SVG kept below, hidden -->
  <svg style="display:none" viewBox="0 0 120 172" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="capClip">
        <rect x="18" y="8" width="84" height="44" rx="13"/>
      </clipPath>
    </defs>

    <!-- Cap -->
    <rect x="18" y="8" width="84" height="44" rx="13" fill="#c4b0e4" stroke="#4a2d7a" stroke-width="3.5"/>
    <rect x="18" y="8" width="84" height="16" rx="13" fill="#d8ccf2"/>
    <!-- Cap ridges -->
    <g clip-path="url(#capClip)" opacity="0.18">
      <line x1="34"  y1="8" x2="34"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="47"  y1="8" x2="47"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="60"  y1="8" x2="60"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="73"  y1="8" x2="73"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
      <line x1="86"  y1="8" x2="86"  y2="52" stroke="#2d1a4a" stroke-width="5"/>
    </g>

    <!-- Neck -->
    <rect x="34" y="50" width="52" height="18" rx="4" fill="#f0eaf8" stroke="#4a2d7a" stroke-width="3"/>

    <!-- Bottle body -->
    <path d="M12,66 H108 V130 Q108,158 60,158 Q12,158 12,130 V66 Z"
          fill="#f0eaf8" stroke="#4a2d7a" stroke-width="3.5"/>

    <!-- Ink fill -->
    <path d="M13.8,94 H106.2 V130 Q106.2,156.2 60,156.2 Q13.8,156.2 13.8,130 V94 Z"
          fill="#a48dd4" opacity="0.72"/>

    <!-- Ink surface shimmer -->
    <ellipse cx="60" cy="94" rx="46" ry="4.5" fill="rgba(255,255,255,0.28)"/>

    <!-- Glass shine -->
    <rect x="94" y="68" width="8" height="52" rx="4" fill="rgba(255,255,255,0.20)"/>

    <!-- Eyes -->
    <circle cx="44" cy="108" r="5.5" fill="#3d2458"/>
    <circle cx="46" cy="106" r="2"   fill="white"/>
    <circle cx="76" cy="108" r="5.5" fill="#3d2458"/>
    <circle cx="78" cy="106" r="2"   fill="white"/>

    <!-- Blush -->
    <ellipse cx="33"  cy="116" rx="9" ry="6" fill="#f5a0b0" opacity="0.68"/>
    <ellipse cx="87"  cy="116" rx="9" ry="6" fill="#f5a0b0" opacity="0.68"/>

    <!-- Smile -->
    <path d="M44,120 Q60,135 76,120"
          stroke="#3d2458" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Ink bubble -->
    <circle cx="27" cy="132" r="4" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  </svg>

  <p class="tagline">Something beautiful is brewing</p>

  <p class="blurb">Over 300 inks, freshly filled to order.<br>Fall in love with a colour before you commit to the bottle.</p>

  <p class="launch-date">5 June 2026 &middot; 6:00 PM BST</p>
  <p class="countdown-label">Launching in</p>

  <div class="countdown" role="timer" aria-live="polite" aria-label="Countdown to launch">
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="days">00</span></div>
      <span class="unit-name">Days</span>
    </div>
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="hours">00</span></div>
      <span class="unit-name">Hours</span>
    </div>
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="minutes">00</span></div>
      <span class="unit-name">Minutes</span>
    </div>
    <div class="unit">
      <div class="unit-box"><span class="unit-number" id="seconds">00</span></div>
      <span class="unit-name">Seconds</span>
    </div>
  </div>

  <p class="launched-msg" id="launched-msg">We're live — welcome to Ink Vial!</p>

  <!-- Early-access unlock -->
  <div class="early-access">
    <button type="button" id="ea-toggle" class="ea-toggle">Have a preview password?</button>
    <form id="ea-form" class="ea-form" autocomplete="off">
      <input type="password" id="ea-pass" placeholder="Enter password" aria-label="Preview password" />
      <button type="submit" class="ea-go">Enter</button>
      <p class="ea-msg" id="ea-msg"></p>
    </form>
  </div>

</main>

<footer>&copy; 2026 Ink Vial &nbsp;&middot;&nbsp; United Kingdom</footer>

<style>
  .early-access{margin-top:40px;text-align:center;}
  .ea-toggle{background:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.06em;color:var(--muted);text-transform:uppercase;transition:color .2s;}
  .ea-toggle:hover{color:var(--purple-dark);}
  .ea-form{display:none;justify-content:center;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .ea-form.show{display:flex;}
  .ea-form input{padding:10px 14px;border:1.5px solid var(--lavender-light);border-radius:8px;background:#fff;font-family:'Nunito',sans-serif;font-size:0.9rem;color:var(--purple-deep);outline:none;width:180px;}
  .ea-form input:focus{border-color:var(--purple-mid);}
  .ea-go{padding:10px 20px;background:var(--purple-dark);color:#fff;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;transition:background .2s;}
  .ea-go:hover{background:var(--purple-mid);}
  .ea-msg{width:100%;font-size:0.8rem;font-weight:700;margin-top:4px;min-height:1em;}
  .ea-msg.err{color:#c0405a;}
  .ea-msg.ok{color:#2d7a3a;}
</style>
<script>
  (function(){
    const toggle=document.getElementById('ea-toggle');
    const form=document.getElementById('ea-form');
    const pass=document.getElementById('ea-pass');
    const msg=document.getElementById('ea-msg');
    toggle.addEventListener('click',()=>{ form.classList.toggle('show'); if(form.classList.contains('show')) pass.focus(); });
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      msg.className='ea-msg'; msg.textContent='Checking…';
      try{
        const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass.value})});
        if(r.ok){ msg.className='ea-msg ok'; msg.textContent='Welcome in! Taking you to the shop…'; setTimeout(()=>{location.href='/shop';},700); }
        else { msg.className='ea-msg err'; msg.textContent='Sorry, that password isn\'t right.'; }
      }catch(err){ msg.className='ea-msg err'; msg.textContent='Something went wrong — please try again.'; }
    });
  })();
</script>

<script>
  const LAUNCH = new Date('2026-06-05T17:00:00Z').getTime();
  const els = {
    days:    document.getElementById('days'),
    hours:   document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
  };
  function pad(n) { return String(n).padStart(2, '0'); }
  function pulse(el, val) {
    if (el.textContent !== val) {
      el.textContent = val;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }
  }
  function tick() {
    const diff = LAUNCH - Date.now();
    if (diff <= 0) {
      Object.keys(els).forEach(k => els[k].textContent = '00');
      document.getElementById('launched-msg').style.display = 'block';
      return;
    }
    pulse(els.days,    pad(Math.floor(diff / 86400000)));
    pulse(els.hours,   pad(Math.floor((diff % 86400000) / 3600000)));
    pulse(els.minutes, pad(Math.floor((diff % 3600000) / 60000)));
    pulse(els.seconds, pad(Math.floor((diff % 60000) / 1000)));
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
