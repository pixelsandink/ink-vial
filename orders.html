<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Orders - Ink Vial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&family=Pacifico&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#faf3e8;--surface:#fff;--purple-deep:#3d2458;--purple-dark:#5c3a9a;--purple-mid:#8b68cc;--lavender-light:#d4c4ee;--lavender-pale:#ede6f8;--muted:rgba(61,36,88,0.55);--border:rgba(176,154,216,0.3);--new:#b8860b;--done:#2d7a3a;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--purple-deep);line-height:1.5;padding:24px 16px 80px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-family:'Pacifico', cursive; font-weight: 400;font-size:1.8rem;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:0.85rem;margin-bottom:18px;}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:0.8rem;font-weight:700;}
  .chip b{font-size:1.2rem;display:block;font-family:'Playfair Display',serif;}
  label.toggle{display:inline-flex;align-items:center;gap:6px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-bottom:16px;}
  .order{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(140,100,210,0.06);}
  .order.new{border-left:4px solid var(--new);}
  .order.done{opacity:0.82;}
  .o-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .o-amt{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;}
  .o-date{font-size:0.78rem;color:var(--muted);}
  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;}
  .badge.new{background:#fdf3d8;color:var(--new);} .badge.done{background:#e3f5e8;color:var(--done);}
  .o-cust{font-size:0.9rem;margin-bottom:6px;}
  .o-cust b{font-weight:800;}
  .o-ship{font-size:0.88rem;color:var(--purple-deep);background:var(--lavender-pale);border-radius:8px;padding:8px 11px;margin:8px 0;}
  .o-items{list-style:none;margin:8px 0;font-size:0.9rem;}
  .o-items li{padding:2px 0;}
  .o-items li::before{content:"• ";color:var(--purple-mid);}
  .ship-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .ship-row input{font-family:'Nunito',sans-serif;font-size:0.85rem;border:1.5px solid var(--lavender-light);border-radius:8px;padding:9px 12px;outline:none;flex:1;min-width:150px;}
  .ship-row input:focus{border-color:var(--purple-mid);}
  .ship-row button{background:var(--purple-dark);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:800;font-size:0.82rem;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;}
  .ship-row button:hover{background:var(--purple-mid);}
  .ship-row button:disabled{opacity:.5;cursor:default;}
  .ship-row button.quiet{background:none;color:var(--purple-dark);border:1.5px solid var(--lavender-light);}
  .ship-row button.quiet:hover{background:var(--lavender-pale);}
  .shipped-info{font-size:0.82rem;color:var(--done);font-weight:700;margin-top:8px;}
  .shipped-info a{color:var(--purple-dark);}
  .top{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 18px;margin:0 0 18px;}
  .top summary{cursor:pointer;font-weight:800;color:var(--purple-dark);padding:10px 0;}
  .top table{width:100%;border-collapse:collapse;font-size:0.88rem;margin:4px 0 12px;}
  .top th{text-align:left;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--border);}
  .top td{padding:7px 4px;border-bottom:1px solid var(--border);}
  .top td.n,.top th.n{text-align:right;font-variant-numeric:tabular-nums;}
  .top .rank{color:var(--muted);width:2.2em;}
  .top .note{font-size:0.78rem;color:var(--muted);margin-bottom:12px;}
  .exports{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 18px;font-size:0.8rem;font-weight:700;color:var(--muted);}
  .exports button{background:var(--surface);color:var(--purple-dark);border:1.5px solid var(--lavender-light);border-radius:8px;padding:8px 12px;font-weight:800;font-size:0.8rem;cursor:pointer;font-family:'Nunito',sans-serif;}
  .exports button:hover{background:var(--lavender-pale);}
  .resend{font-size:0.75rem;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;margin-left:8px;}
  .gate{max-width:380px;margin:60px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;}
  .gate input{width:100%;margin:14px 0;border:1.5px solid var(--lavender-light);border-radius:8px;padding:10px;font-family:'Nunito',sans-serif;}
  .gate button{width:100%;background:var(--purple-dark);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}
  .msg{text-align:center;padding:40px;color:var(--muted);}
  .err{color:#c0405a;}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="msg">Loading…</div></div>
<script>
const qs = new URLSearchParams(location.search);
let KEY = qs.get('key') || '';
let orders = [];
const root = document.getElementById('root');
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function gate(err){
  root.innerHTML='<div class="gate"><h1 style="font-size:1.4rem;">Orders</h1>'
    +(err?'<p class="err" style="margin-top:8px;">'+err+'</p>':'<p class="sub">Enter your admin key to continue.</p>')
    +'<input type="text" id="k" placeholder="Admin key" autocomplete="off" /><button onclick="go()">View orders</button></div>';
  const i=document.getElementById('k'); if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==="Enter")go();});}
}
function go(){const v=document.getElementById('k').value.trim();if(v)location.search='?key='+encodeURIComponent(v);}

// Catalogue lookup so pack sales can be split into the inks inside them
let CATALOG={}, topOpen=false;
fetch('/catalog.json').then(r=>r.json()).then(c=>{CATALOG=c; if(orders.length) render();}).catch(()=>{});

// Split an order into what was actually sent. Order lines are stored as
// "2 x Brand Name"; a pack becomes one line per ink inside it, and
// accessories are kept but marked so they can be left out of vial counts.
function orderLines(o){
  const byLabel={};
  for(const id in CATALOG){ const c=CATALOG[id]; byLabel[(c.brand?c.brand+' ':'')+c.name]=c; }
  const out=[];
  (o.items||[]).forEach(s=>{
    const m=String(s).match(/^(\d+)\s*[x×]\s*(.+)$/i); const qty=m?parseInt(m[1]):1; const label=(m?m[2]:String(s)).trim();
    const c=byLabel[label];
    if(c && c.components) c.components.forEach(id=>{ const k=CATALOG[id]||{};
      out.push({label:(k.brand?k.brand+' ':'')+(k.name||id),brand:k.brand||'',name:k.name||id,qty,pack:c.name,accessory:false}); });
    else out.push({label,brand:c?c.brand:'',name:c?c.name:label,qty,pack:'',accessory:!!(c&&c.type==='accessory')});
  });
  return out;
}

// Units sold per ink across every order; packs count once for each ink
// inside them, and accessories are left out.
function topSellers(n){
  const tally={};
  orders.forEach((o,orderNo)=>orderLines(o).forEach(l=>{ if(l.accessory) return;
    const t=tally[l.label]=tally[l.label]||{name:l.label,qty:0,orders:new Set()}; t.qty+=l.qty; t.orders.add(orderNo); }));
  return Object.values(tally).sort((a,b)=>b.qty-a.qty||b.orders.size-a.orders.size||a.name.localeCompare(b.name)).slice(0,n);
}

// ── CSV exports ──────────────────────────────────────────
const isoDay=iso=>String(iso||'').slice(0,10), isoMonth=iso=>String(iso||'').slice(0,7);
const vialsIn=o=>orderLines(o).reduce((n,l)=>n+(l.accessory?0:l.qty),0);
function download(name,rows){
  const cell=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const blob=new Blob(['﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'-'+isoDay(new Date().toISOString())+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportOrders(){
  download('ink-vial-orders',[['Date','Order','Customer','Email','Ship to','Total','Vials','Items','Shipped','Shipped on','Tracking']]
    .concat(orders.map(o=>[isoDay(o.at),o.session,o.name,o.email,o.ship,o.amount,vialsIn(o),(o.items||[]).join('; '),
      o.shipped?'Yes':'No',isoDay(o.shippedAt),o.tracking])));
}
function exportItems(){
  const rows=[['Date','Month','Order','Brand','Ink','Vials','From pack','Type']];
  orders.forEach(o=>orderLines(o).forEach(l=>rows.push([isoDay(o.at),isoMonth(o.at),o.session,l.brand,l.name,l.qty,l.pack,
    l.accessory?'Accessory':(l.pack?'Pack ink':'Ink')])));
  download('ink-vial-items-sold',rows);
}
function exportBrands(){
  const t={};
  orders.forEach(o=>{ const mo=isoMonth(o.at); const seen=new Set();
    orderLines(o).forEach(l=>{ if(l.accessory) return; const b=l.brand||'(unknown)'; const k=mo+'|'+b;
      const r=t[k]=t[k]||{mo,b,v:0,o:0}; r.v+=l.qty; if(!seen.has(k)){seen.add(k);r.o++;} }); });
  const rows=Object.values(t).sort((x,y)=>x.mo.localeCompare(y.mo)||y.v-x.v);
  download('ink-vial-vials-by-brand',[['Month','Brand','Vials','Orders']].concat(rows.map(r=>[r.mo,r.b,r.v,r.o])));
}

async function load(){
  if(!KEY){gate();return;}
  try{
    const r=await fetch('/api/orders?key='+encodeURIComponent(KEY));
    if(r.status===401){gate('That key was not accepted.');return;}
    const d=await r.json(); orders=d.orders||[]; render();
  }catch(e){root.innerHTML='<div class="msg err">Could not load orders: '+e.message+'</div>';}
}

function fmtDate(iso){ try{return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso||'';} }

function render(){
  const hideShipped=(document.getElementById('hideShipped')||{}).checked||false;
  let list=orders.slice();
  if(hideShipped) list=list.filter(o=>!o.shipped);
  const toShip=orders.filter(o=>!o.shipped).length;

  root.innerHTML='<h1>Orders</h1><p class="sub">'+orders.length+' total · '+toShip+' to ship · “Mark shipped & email” notifies the customer; “no email” just updates the status</p>'
    +'<div class="chips"><div class="chip"><b>'+orders.length+'</b>Total orders</div><div class="chip"><b style="color:var(--new)">'+toShip+'</b>To ship</div></div>'
    +(orders.length?'<div class="exports"><span>Export (CSV):</span><button id="exOrders">All orders</button><button id="exItems">Everything sold</button><button id="exBrands">Vials by brand &amp; month</button></div>':'')
    +(()=>{ const top=topSellers(20); if(!top.length) return '';
        return '<details class="top"'+(topOpen?' open':'')+'><summary>Top 20 inks sold</summary>'
          +'<p class="note">Vials sold across all '+orders.length+' orders. Packs count towards each ink inside them; accessories are left out.</p>'
          +'<table><thead><tr><th></th><th>Ink</th><th class="n">Vials</th><th class="n">Orders</th></tr></thead><tbody>'
          +top.map((t,i)=>'<tr><td class="rank">'+(i+1)+'</td><td>'+esc(t.name)+'</td><td class="n"><b>'+t.qty+'</b></td><td class="n">'+t.orders.size+'</td></tr>').join('')
          +'</tbody></table></details>'; })()
    +'<label class="toggle"><input type="checkbox" id="hideShipped"'+(hideShipped?' checked':'')+' /> Hide shipped</label>'
    +'<div id="list"></div>';
  const wrap=document.getElementById('list');
  if(!list.length){ wrap.innerHTML='<div class="msg">No orders yet.</div>'; }
  list.forEach(o=>{
    const div=document.createElement('div');
    div.className='order '+(o.shipped?'done':'new');
    let html='<div class="o-top"><span class="o-amt">'+esc(o.amount||'')+'</span>'
      +'<span class="badge '+(o.shipped?'done':'new')+'">'+(o.shipped?'Shipped':'New')+'</span></div>'
      +'<div class="o-date">'+fmtDate(o.at)+'</div>'
      +'<div class="o-cust"><b>'+esc(o.name||'(no name)')+'</b> · '+esc(o.email||'')+'</div>'
      +(o.ship?'<div class="o-ship">📮 '+esc(o.ship)+'</div>':'')
      +'<ul class="o-items">'+(o.items||[]).map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
    if(o.shipped){
      html+='<div class="shipped-info">✓ Shipped '+fmtDate(o.shippedAt)+(o.tracking?' · '+esc(o.tracking):'')
        +(o.emailed===false?' · not emailed':'')
        +'<button class="resend" data-s="'+esc(o.session)+'">'+(o.emailed===false?'send email':'resend email')+'</button></div>';
    }else{
      html+='<div class="ship-row"><input type="text" placeholder="Tracking number (optional)" data-track="'+esc(o.session)+'" />'
        +'<button data-ship="'+esc(o.session)+'">Mark shipped & email</button>'
        +'<button class="quiet" data-ship-quiet="'+esc(o.session)+'">Mark shipped (no email)</button></div>';
    }
    wrap.appendChild(div); div.innerHTML=html;
  });

  document.getElementById('hideShipped').addEventListener('change',render);
  [['exOrders',exportOrders],['exItems',exportItems],['exBrands',exportBrands]].forEach(([id,fn])=>{ const b=document.getElementById(id); if(b) b.addEventListener('click',fn); });
  const topEl=document.querySelector('.top'); if(topEl) topEl.addEventListener('toggle',()=>{topOpen=topEl.open;});
  wrap.querySelectorAll('[data-ship]').forEach(b=>b.addEventListener('click',()=>ship(b.getAttribute('data-ship'),false)));
  wrap.querySelectorAll('[data-ship-quiet]').forEach(b=>b.addEventListener('click',()=>ship(b.getAttribute('data-ship-quiet'),false,true)));
  wrap.querySelectorAll('.resend').forEach(b=>b.addEventListener('click',()=>ship(b.getAttribute('data-s'),true)));
}

async function ship(session, resend, noEmail){
  const order=orders.find(o=>o.session===session); if(!order)return;
  let url='/api/ship?key='+encodeURIComponent(KEY)+'&session='+encodeURIComponent(session);
  if(!resend){
    const t=(document.querySelector('[data-track="'+CSS.escape(session)+'"]')||{}).value||'';
    if(t.trim()) url+='&tracking='+encodeURIComponent(t.trim());
    if(noEmail) url+='&noemail=1';
  } else { url+='&resend=1'; if(order.tracking) url+='&tracking='+encodeURIComponent(order.tracking); }
  const btn=event&&event.target, label=btn?btn.textContent:''; if(btn){btn.disabled=true;btn.textContent=noEmail?'Saving…':'Sending…';}
  try{
    const r=await fetch(url); const d=await r.json();
    if(d.ok){ order.shipped=true; order.shippedAt=new Date().toISOString(); if(d.tracking)order.tracking=d.tracking; if(!d.alreadyShipped)order.emailed=d.emailed; render(); }
    else { alert(d.error||'Error'); if(btn){btn.disabled=false;btn.textContent=label;} }
  }catch(e){ alert('Failed: '+e.message); if(btn){btn.disabled=false;btn.textContent=label;} }
}
load();
</script>
</body>
</html>
